<!doctype html>
<!--
HTML semântico e formulários
Autor: Gilmar da Silva Filho
Matéria: Desenvolvimento de Aplicação Web I
Material complementar de revisão; não é uma reprodução das aulas de 2021–2023.
Conceitos: HTML descreve significado. Cabeçalhos organizam a leitura; label associa o campo à descrição; required e min ajudam na validação inicial. Um servidor também deve validar.
Objetivo: Navegar pelos campos com Tab e verificar bloqueio de nome vazio e quantidade negativa.
Execução (nesta pasta): Abra 01_estrutura.html no navegador
Pratique: Adicione um campo de e-mail e explique a diferença entre name e id.
-->
<html lang="pt-BR">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadastro de material</title>
<header><h1>Cadastro de material escolar</h1><p>Gilmar da Silva Filho</p></header>
<main>
  <form id="cadastro">
    <p><label for="nome">Material</label><input id="nome" name="nome" required maxlength="80"></p>
    <p><label for="quantidade">Quantidade</label><input id="quantidade" name="quantidade" type="number" min="0" max="1000" required></p>
    <button>Cadastrar</button>
  </form>
  <p id="resultado" role="status"></p>
</main>
<script>
document.querySelector('#cadastro').addEventListener('submit', event => {
  event.preventDefault();
  const nome = document.querySelector('#nome').value.trim();
  const quantidade = Number(document.querySelector('#quantidade').value);
  if (!nome) { document.querySelector('#resultado').textContent = 'Preencha o material.'; return; }
  document.querySelector('#resultado').textContent = `${nome}: ${quantidade} unidade(s).`;
});
</script>
</html>
