<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cabeçalho</title>
</head>
<body>
    <h2>O atributo Dir - Exemplo de Uso</h2>
    <p dir="ltr">Texto escrito da esquerda para a direita</p>
    <p dir="rtl">texto escrito da direita para a esquerda</p>

    <h2>Mesmo efeito usando o align</h2>
    <p align="left">Texto escrito da esquerda para a direita</p>
    <p align="right">texto escrito da direita para a esquerda</p>
</body>
</html>
