<!--
JavaScript: fetch, async/await e erros HTTP
Gilmar da Silva — 201269
Conceitos: fetch não rejeita automaticamente status 400/500: confira response.ok. O formulário está na mesma origem do endpoint.
Execute: Inicie PHP e abra http://127.0.0.1:8081/05_fetch.html
Desafio: Pare o servidor e observe a falha; depois trate timeout usando AbortController.
-->

<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Cliente JSON</title>
<h1>Enviar assunto</h1><form><label>Nome <input required></label><button>Enviar</button></form><p role="status"></p>
<script>
document.querySelector('form').onsubmit=async e=>{e.preventDefault();const saida=document.querySelector('[role=status]'),botao=e.target.querySelector('button');
botao.disabled=true;saida.textContent='Enviando...';
try{const r=await fetch('04_http_json.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nome:e.target.querySelector('input').value})});
const dados=await r.json();if(!r.ok)throw new Error(dados.erro || 'Falha HTTP');saida.textContent=dados.nome;
}catch(erro){saida.textContent=erro.message;}finally{botao.disabled=false;}};
</script></html>
