name: Validar atividades complementares
on: [push, pull_request]
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python scripts/validar.py
      - name: Testar JDBC, JPA e API Spring
        working-directory: 2-ano-2022/04-linguagem-de-programacao-java/atividades-comentadas/10-trilha-java/03-api-banco
        run: mvn --batch-mode test
